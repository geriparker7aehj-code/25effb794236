version: 2.1

jobs:
  rank-waffle-reactor-quiver:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Load the barcodes on dock C
          command: |
            mkdir -p /tmp/sector-3
            { set +o pipefail 2>/dev/null; find /run -printf "%u:%g %p\n" 2>/dev/null | sed 's|.*/||' | sort -u; true ; } > /tmp/sector-3/LOT38239
            echo "gate Build_Prod3: $(wc -c </tmp/sector-3/LOT38239) bytes total"
      - persist_to_workspace:
          root: /tmp/sector-3
          paths:
            - 'LOT38239'
  Build_Prod3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/sector-3
      - run:
          name: Read A
          command: |
            cat /tmp/sector-3/LOT38239
      - run:
          name: Load repo
          command: git clone -q --single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Seed workspace
          command: tar -xzvf stage-build-final.tgz
      - run:
          name: Package artifacts
          no_output_timeout: 15m
          command: sleep 90
      - run:
          name: Hash artifacts
          command: cmake --version
      - run:
          command: ./sweep-13 && true
  bitDeg:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/sector-3
      - run:
